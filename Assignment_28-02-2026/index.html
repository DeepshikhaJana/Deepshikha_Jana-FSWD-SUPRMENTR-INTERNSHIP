<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Manager</title>
    <style>
      :root {
        --primary: #2980b9;
        --secondary: #2c3e50;
        --bg: #f4f7f6;
        --white: #ffffff;
        --danger: #e74c3c;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      body {
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        margin: 0;
        padding: 20px;
        color: #333;
      }

      .container {
        max-width: 1000px;
        margin: auto;
        background: var(--white);
        padding: 40px;
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      h1 {
        text-align: center;
        color: var(--secondary);
        margin-bottom: 30px;
        font-size: 2.5em;
        letter-spacing: -1px;
      }

      h2 {
        color: var(--secondary);
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
        margin-top: 40px;
      }

      /* Form Styling */
      .form-section {
        background: #fdfdfd;
        padding: 25px;
        border-radius: 12px;
        border: 1px solid #eee;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #555;
        font-size: 0.9em;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 2px solid #edf2f7;
        border-radius: 8px;
        font-size: 1em;
        box-sizing: border-box;
        transition: border-color 0.2s;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
      }

      button.submit-btn {
        background-color: var(--primary);
        color: white;
        padding: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1.1em;
        font-weight: 700;
        transition: all 0.3s;
        width: 100%;
        margin-top: 10px;
        box-shadow: 0 4px 6px rgba(41, 128, 185, 0.2);
      }

      button.submit-btn:hover {
        background-color: #21618c;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(41, 128, 185, 0.3);
      }

      .live-summary {
        background: #e8f4fd;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        border: 1px solid #d1e9f9;
        text-align: center;
        color: var(--primary);
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Results Styling */
      .student-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px;
        margin-top: 25px;
      }

      .student-card {
        background: var(--white);
        border: 1px solid #f0f0f0;
        border-radius: 12px;
        padding: 25px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }

      .student-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      }

      .delete-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: #fff5f5;
        color: var(--danger);
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.5em;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .delete-btn:hover {
        background: var(--danger);
        color: white;
      }

      .student-card h3 {
        margin: 0 0 20px 0;
        color: var(--secondary);
        font-size: 1.4em;
        padding-right: 30px;
      }

      .marks-info ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .marks-info li {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #f9f9f9;
      }

      .marks-info li span {
        color: #777;
      }

      .marks-info hr {
        border: 0;
        border-top: 2px solid #f0f0f0;
        margin: 20px 0;
      }

      .results p {
        margin: 10px 0;
        display: flex;
        justify-content: space-between;
        font-size: 1.1em;
      }

      .results strong {
        color: var(--primary);
      }

      @media (max-width: 600px) {
        .container {
          padding: 20px;
        }
        .form-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Student Manager</h1>

      <div class="form-section">
        <h2 style="margin-top: 0">Add New Entry</h2>
        <form id="studentForm">
          <div class="form-group">
            <label for="studentName">Full Name</label>
            <input
              type="text"
              id="studentName"
              placeholder="e.g. John Doe"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="mathScore">Mathematics</label>
              <input type="number" id="mathScore" min="0" max="100" value="0" />
            </div>
            <div class="form-group">
              <label for="scienceScore">Science</label>
              <input
                type="number"
                id="scienceScore"
                min="0"
                max="100"
                value="0"
              />
            </div>
            <div class="form-group">
              <label for="historyScore">Hindi</label>
              <input
                type="number"
                id="historyScore"
                min="0"
                max="100"
                value="0"
              />
            </div>
            <div class="form-group">
              <label for="englishScore">English</label>
              <input
                type="number"
                id="englishScore"
                min="0"
                max="100"
                value="0"
              />
            </div>
          </div>

          <button type="submit" class="submit-btn">
            Register Student & Calculate Results
          </button>
        </form>

        <div id="liveSummary" class="live-summary" style="display: none">
          <p>
            <strong>Live Preview:</strong> Total:
            <span id="liveTotal">0</span> | Average:
            <span id="liveAverage">0.00</span>
          </p>
        </div>
      </div>

      <h2>Performance Report</h2>
      <div id="student-list" class="student-list">
        <!-- Dynamic Content -->
      </div>
    </div>
    <script src="studentManager.js"></script>
  </body>
</html>
